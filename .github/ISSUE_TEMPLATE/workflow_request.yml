name: Workflow request
description: Tell us how you design a case today and what DentCraft should do.
labels: [workflow]
body:
  - type: markdown
    attributes:
      value: |
        This form is for dental technicians and dentists. Describe the work in your own words;
        there is no wrong answer. **Do not attach patient data.**
  - type: dropdown
    id: role
    attributes:
      label: You are a
      options: [Dental technician, Dentist, Student, Educator, Developer, Other]
    validations:
      required: true
  - type: textarea
    id: case
    attributes:
      label: The case
      description: Which restoration, material and machine (mill or printer)?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The steps you follow and where they cost you time or precision.
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What DentCraft should do
