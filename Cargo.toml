[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elnajar1/DentCraft"
authors = ["Dr. Mahmoud ElNajar", "DentCraft contributors"]
rust-version = "1.85"

[workspace.dependencies]
dentcraft-mesh = { path = "crates/dentcraft-mesh" }
dentcraft-io = { path = "crates/dentcraft-io" }
dentcraft-case = { path = "crates/dentcraft-case" }
dentcraft-workflow = { path = "crates/dentcraft-workflow" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
