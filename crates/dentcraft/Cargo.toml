[package]
name = "dentcraft"
description = "DentCraft desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dentcraft-anatomy = { workspace = true }
dentcraft-case = { workspace = true }
dentcraft-design = { workspace = true }
dentcraft-io = { workspace = true }
dentcraft-mesh = { workspace = true }
dentcraft-render = { workspace = true }
dentcraft-workflow = { workspace = true }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "persistence", "x11", "wayland"] }
# Same version as dentcraft-render: its camera API takes glam vectors.
glam = "0.34.1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"

[lints]
workspace = true
